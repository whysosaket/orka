# Overlay on deploy/ec2/compose.yml: same persistent stack, managed cloud settings.
services:
  api:
    image: ${ORKA_IMAGE:-ghcr.io/whysosaket/orka-api:0.3.0}
    environment:
      DEPLOYMENT_MODE: cloud
      DASHBOARD_URL: ${DASHBOARD_URL:-}
      DASHBOARD_PROXY_SECRET: ${DASHBOARD_PROXY_SECRET:-}
      GITHUB_ENABLED: 'true'
      MAGIC_LINK_ENABLED: 'true'
      EMAIL_PROVIDER: resend
      RESEND_API_KEY: ${RESEND_API_KEY:?Set RESEND_API_KEY}
      RESEND_FROM: ${RESEND_FROM:?Set a verified Resend sender}
      SEND_EMAIL_HOOK_SECRET: ${SEND_EMAIL_HOOK_SECRET:?Set SEND_EMAIL_HOOK_SECRET}
  auth:
    environment:
      GOTRUE_DISABLE_SIGNUP: ${DISABLE_SIGNUP:-true}
      GOTRUE_EXTERNAL_GITHUB_ENABLED: 'true'
      GOTRUE_EXTERNAL_GITHUB_REDIRECT_URI: ${DASHBOARD_URL:-https://${DOMAIN}}/auth/callback
      GOTRUE_URI_ALLOW_LIST: orka://auth/callback,orka://auth/callback?profile=*${DASHBOARD_URL:+,${DASHBOARD_URL}/auth/session?flow=*}
      GOTRUE_EXTERNAL_GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:?Set GITHUB_CLIENT_ID}
      GOTRUE_EXTERNAL_GITHUB_SECRET: ${GITHUB_CLIENT_SECRET:?Set GITHUB_CLIENT_SECRET}
      GOTRUE_HOOK_SEND_EMAIL_ENABLED: 'true'
      GOTRUE_HOOK_SEND_EMAIL_SECRETS: ${SEND_EMAIL_HOOK_SECRET:?Set SEND_EMAIL_HOOK_SECRET}
