name: Backend checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run build && npm run typecheck && npm run lint && npm run format:check && npm test
      - run: npm run test:go && go vet ./internal/... ./cmd/... && test -z "$(gofmt -l cmd internal packages/server-core/migrations)"
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./cmd/orka-server
      - run: npm run contracts:check
      - run: npm run check:repository && npm run licenses:check
      - name: Check deployment lifecycle and shell scripts
        run: |
          shellcheck configure.sh orka-server deploy/self-hosted/restore.sh scripts/managed/deploy-*.sh tests/deploy-*.sh deploy/ec2/backup.sh deploy/ec2/restore-check.sh
          bash tests/deploy-host.sh
          bash tests/deploy-ssh.sh
          bash tests/deploy-network.sh
          bash tests/deploy-backup.sh
          python3 -B -m unittest discover -s tests -p '*_test.py'
      - name: Validate GitHub workflows
        run: |
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/actionlint.tar.gz" https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint"
      - run: npm audit --omit=dev --audit-level=high
      - run: PG_BIN=/usr/lib/postgresql/16/bin npm run test:integration
  images:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      matrix:
        edition: [oss, managed]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci && npm run build
      - run: docker build --target ${{ matrix.edition }} -f deploy/Dockerfile -t orka-test:${{ matrix.edition }} .
      - run: npm run test:images -- ${{ matrix.edition }} orka-test:${{ matrix.edition }}
      - if: matrix.edition == 'oss'
        run: npm run test:images -- oss orka-test:oss compose.yml
      - if: matrix.edition == 'oss'
        run: npm run test:self-hosted
      - if: matrix.edition == 'oss'
        run: ORKA_TEST_OPERATOR_IMAGE=orka-test:oss npm run test:self-hosted
