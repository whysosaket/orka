[package]
name = "portable-workspace-mac"
version = "0.3.4"
edition = "2021"
license = "MIT"
repository = "https://github.com/whysosaket/orka"
default-run = "portable-workspace-mac"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-deep-link = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.41.1", features = ["bundled"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
tokio = { version = "1", features = ["full"] }
keyring = { version = "3", features = ["apple-native"] }
uuid = { version = "1", features = ["v4", "v5"] }
sha2 = "0.11"
dirs = "7"
walkdir = "2"
chrono = { version = "0.4", features = ["serde"] }
fs2 = "0.4"
regex = "1"
tempfile = "3"
libc = "0.2"
age = { version = "0.12", default-features = false }
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.10"
base64 = "0.23"
zeroize = { version = "1", features = ["derive"] }
zstd = { version = "0.14.3", default-features = false }
ignore = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSWorkspace", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSGraphicsContext", "objc2-core-graphics"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString", "NSURL", "NSData", "NSDictionary", "NSGeometry", "NSError"] }

[profile.release]
strip = true
lto = true
codegen-units = 1

[dependencies.zip]
version = "9.0.5"
default-features = false
features = ["deflate"]
