name: Checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  server:
    name: Self-hosted Compose server
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: server/.node-version
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: shellcheck configure.sh orka-server deploy/self-hosted/restore.sh
      - run: npm run build && npm run typecheck && npm run lint && npm run format:check && npm test
      - run: npm run test:go && go vet ./internal/... ./cmd/...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./cmd/orka-server
      - run: npm run contracts:check
      - run: npm run licenses:check
      - run: PG_BIN=/usr/lib/postgresql/16/bin npm run test:integration
      - run: docker build --target oss -f deploy/Dockerfile -t orka-test:oss .
      - run: npm run test:images -- oss orka-test:oss compose.yml
      - run: npm run test:self-hosted
      - run: ORKA_TEST_OPERATOR_IMAGE=orka-test:oss npm run test:self-hosted
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run check:repository
      - run: npm run lint && npm run format:check
      - run: npm run typecheck && npm test && npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
  mac-recovery:
    name: macOS recovery (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        runner: [macos-15, macos-15-intel]
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/test-macos-recovery.sh
  mac:
    name: macOS desktop
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          components: rustfmt, clippy
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          key: ${{ runner.os }}-${{ runner.arch }}-native-${{ hashFiles('apps/mac/src-tauri/Cargo.lock', 'apps/mac/src-tauri/Cargo.toml') }}
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            apps/mac/src-tauri/target/
      - run: npm ci
      - run: npm run licenses:check
      # Native fixtures share process-wide environment variables and file locks.
      - run: cargo fmt --check && cargo test --locked -- --test-threads=1 && cargo clippy --locked --all-targets -- -D warnings
        working-directory: apps/mac/src-tauri
      - run: npm run tauri -w @portable/mac -- build --debug --bundles app
      - run: npm run test:plugin-native
      - run: npm run test:profiles
      - run: npm run test:repository-access
