name: Publish self-hosted server
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: server-release-${{ github.sha }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: server/.node-version
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci && npm run build && npm run typecheck && npm run test:go && npm run contracts:check && npm test
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build and exercise the operator image
        run: |
          docker build --target oss -f deploy/Dockerfile -t orka-test:release .
          npm run test:images -- oss orka-test:release compose.yml
          ORKA_TEST_OPERATOR_IMAGE=orka-test:release npm run test:self-hosted
      - name: Publish the immutable multi-platform image and operator archive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_OWNER: ${{ github.repository_owner }}
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_REPOSITORY: ${{ github.repository }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$REGISTRY_USER" --password-stdin
          image="ghcr.io/${REGISTRY_OWNER,,}/orka-server:sha-${SOURCE_SHA}"
          mkdir -p artifacts/release
          docker buildx build --platform linux/amd64,linux/arm64 --target oss -f deploy/Dockerfile \
            --label "org.opencontainers.image.source=https://github.com/${SOURCE_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${SOURCE_SHA}" \
            --tag "$image" --build-arg "VERSION=${SOURCE_SHA:0:12}" --metadata-file artifacts/release/image.json --push .
          digest=$(node -p 'JSON.parse(require("node:fs").readFileSync("artifacts/release/image.json"))["containerimage.digest"]')
          pinned="ghcr.io/${REGISTRY_OWNER,,}/orka-server@${digest}"
          mkdir "$RUNNER_TEMP/anonymous-docker"
          if ! docker --config "$RUNNER_TEMP/anonymous-docker" manifest inspect "$pinned" >/dev/null; then
            echo 'The container package must be public before an operator release can be published. Set its visibility to public in GitHub package settings, then rerun.' >&2
            exit 1
          fi
          npm run package:operator -- "$pinned"
          tag="server-${SOURCE_SHA:0:12}"
          gh release create "$tag" --repo "$SOURCE_REPOSITORY" --target "$SOURCE_SHA" \
            --title "Orka server ${SOURCE_SHA:0:12}" --notes "Self-hosted operator bundle for source commit ${SOURCE_SHA}. Requires Docker Compose 2.24+, a shell and OpenSSL; backup/recovery also require Bash and Python 3." \
            artifacts/release/orka-server.tar.gz artifacts/release/orka-server.tar.gz.sha256 artifacts/release/image.json
